[package]
name = "stems-engine"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"

[dependencies]
cpal = "0.18"
rtrb = "0.3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
triple_buffer = "8"

[dev-dependencies]
assert_no_alloc = "1"
serde_json = "1"
